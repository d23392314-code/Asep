name: Build Asep
on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Suntik API key dari Secrets
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          STT_KEY: ${{ secrets.STT_KEY }}
        run: |
          sed -i "s|PASTE_OPENROUTER_KEY_DISINI|${OPENROUTER_KEY}|" asep_mochi/asep_mochi.ino
          if [ -n "$STT_KEY" ]; then
            sed -i "s|#define STT_API_KEY   \"\"|#define STT_API_KEY   \"${STT_KEY}\"|" asep_mochi/asep_mochi.ino
          fi

      - name: Install core ESP32 (coba beberapa versi kalau server error)
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          ok=0
          for ver in 3.3.0 3.2.0 latest; do
            for try in 1 2 3; do
              echo "=== Core $ver, percobaan $try ==="
              if [ "$ver" = "latest" ]; then target="esp32:esp32"; else target="esp32:esp32@$ver"; fi
              if arduino-cli core install "$target"; then ok=1; break 2; fi
              sleep 30
            done
          done
          if [ "$ok" != "1" ]; then echo "Semua versi gagal diunduh"; exit 1; fi
          arduino-cli core list
          for i in 1 2 3; do
            arduino-cli lib install LovyanGFX ArduinoJson && break
            sleep 20
          done

      - name: Compile
        # Ubah PSRAM=opi jadi PSRAM=enabled kalau board kamu QSPI PSRAM (bukan N16R8)
        # Ubah FlashSize sesuai board (4M / 8M / 16M)
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:PSRAM=opi,PartitionScheme=huge_app,FlashSize=16M \
            --export-binaries asep_mochi

      - uses: actions/upload-artifact@v4
        with:
          name: asep-bin
          path: asep_mochi/build/**/*.bin


